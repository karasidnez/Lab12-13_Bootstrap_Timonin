<!DOCTYPE html>
<html lang="ru-Ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксперимент с Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Подключение custom.css -->
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div class="container my-4">
        <div class="row justify-content-center g-4">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg" style="width: 18rem;">
                    <img src="https://placeholder.apptor.studio/400/300/laptop.png" class="card-img-top" alt="Игровой ноутбук">
                    
                    <div class="p-3 border-bottom">
                        <span class="badge bg-warning text-dark mb-2">★★★★★ 4.5</span>
                        <div class="fs-3 fw-bold">89 990 ₽</div>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title">Игровой ноутбук</h5>
                        <p class="card-text">Мощный ноутбук для работы и игр.</p>
                        <a href="#" class="btn btn-primary">Подробнее</a>
                        <a href="#" class="btn btn-success w-100 mt-2">Купить</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg" style="width: 18rem;">
                    <img src="https://placeholder.apptor.studio/400/300/notebook.png" class="card-img-top" alt="Potato PC">
                    
                    <div class="p-3 border-bottom">
                        <span class="badge bg-warning text-dark mb-2">★★★★☆ 4.2</span>
                        <div class="fs-3 fw-bold">54 990 ₽</div>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title">Potato PC</h5>
                        <p class="card-text">Легкий и компактный для работы в дороге.</p>
                        <a href="#" class="btn btn-primary">Подробнее</a>
                        <a href="#" class="btn btn-warning w-100 mt-2">Купить</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg" style="width: 18rem;">
                    <img src="https://placeholder.apptor.studio/400/300/ultrabook.png" class="card-img-top" alt="Шизобук">
                    
                    <div class="p-3 border-bottom">
                        <span class="badge bg-warning text-dark mb-2">★★★★★ 4.8</span>
                        <div class="fs-3 fw-bold">129 990 ₽</div>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title">Шизобук</h5>
                        <p class="card-text">Тонкий и мощный для профессиональных шизов.</p>
                        <a href="#" class="btn btn-primary">Подробнее</a>
                        <a href="#" class="btn btn-success w-100 mt-2">Купить</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
</html>
